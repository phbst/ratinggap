name: Build and deploy

on:
  push:
    branches: [main]
  # Refresh the data weekly. New numbers + new teardowns give crawlers a reason to come back.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Only re-pull from Apple on the schedule / manual runs — a plain push rebuilds
      # from the committed snapshot so deploys stay fast and reproducible.
      #
      # This has to run in CI rather than locally: Apple rate-limits the customerreviews
      # feed per IP and blocks a developer machine within a few hundred requests.
      - name: Refresh App Store data
        if: github.event_name != 'push'
        run: node scripts/fetch.mjs

      # Commit the refreshed snapshot back so a later push-triggered deploy serves the
      # same data the scheduled run produced, instead of reverting to a stale file.
      - name: Commit refreshed snapshot
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/apps.json; then
            echo "no data change"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/apps.json
            git commit -m "Refresh App Store snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Build site
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          GA_ID: ${{ vars.GA_ID }}
          GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
